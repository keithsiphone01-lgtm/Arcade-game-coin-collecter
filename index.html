<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Retro Arcade Cabinet</title>
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-yellow: #ffea00;
            --neon-green: #00ff66;
            --cabinet-dark: #0c0c14;
        }

        body {
            background-color: #040408;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .arcade-container {
            display: flex;
            background: linear-gradient(145deg, #151525, #05050b);
            border: 4px solid var(--neon-blue);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }

        .side-panel {
            width: 140px;
            background-color: var(--cabinet-dark);
            border-right: 4px dashed var(--neon-pink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 20px 5px;
            box-sizing: border-box;
        }

        .arcade-logo {
            writing-mode: vertical-rl;
            text-transform: uppercase;
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            letter-spacing: 6px;
            transform: rotate(180deg);
        }

        .main-game-area {
            flex-grow: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #222;
            font-size: 0.9rem;
        }

        .player-status { width: 45%; }
        .p1-title { color: var(--neon-blue); font-weight: bold; }
        .p2-title { color: var(--neon-pink); font-weight: bold; }

        .health-bar-container {
            background-color: #222;
            height: 10px;
            border-radius: 5px;
            margin-top: 4px;
            overflow: hidden;
            border: 1px solid #444;
        }

        .health-bar { height: 100%; width: 100%; transition: width 0.1s linear; }
        #p1-health { background-color: var(--neon-blue); }
        #p2-health { background-color: var(--neon-pink); }

        .high-score-container {
            text-align: center;
            color: var(--neon-yellow);
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 0 5px rgba(255, 234, 0, 0.5);
        }

        .screen-container { position: relative; }
        .screen-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            z-index: 5;
            background-size: 100% 4px;
            pointer-events: none;
        }

        canvas {
            background-color: #020205;
            border: 3px solid #222;
            display: block;
            border-radius: 4px;
        }

        .controls-guide {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            font-size: 0.75rem;
            color: #777;
        }
    </style>
</head>
<body>

<div class="arcade-container">
    <div class="side-panel">
        <div style="font-size:1.5rem;">🕹️</div>
        <div class="arcade-logo">B-COIN POOL</div>
        <div style="font-size:1.5rem;">⚔️</div>
    </div>

    <div class="main-game-area">
        <div class="high-score-container">👑 HI-SCORE: <span id="hi-score-val">0</span></div>
        
        <div class="hud">
            <div class="player-status" id="p1-hud">
                <div class="p1-title">P1: <span id="p1-score">0</span> <span id="p1-status-icon"></span></div>
                <div class="health-bar-container"><div id="p1-health" class="health-bar"></div></div>
            </div>
            <div class="player-status" id="p2-hud" style="text-align: right;">
                <div class="p2-title">P2: <span id="p2-score">0</span> <span id="p2-status-icon"></span></div>
                <div class="health-bar-container"><div id="p2-health" class="health-bar"></div></div>
            </div>
        </div>

        <div class="screen-container">
            <canvas id="gameCanvas" width="600" height="420"></canvas>
        </div>

        <div class="controls-guide">
            <div id="p1-label"><strong>P1:</strong> A/D to Move | Space to Fire</div>
            <div>🌟 🪙=Points | 🛡️=Shield | 🔫/🚀=Weapons | 💣=Danger</div>
            <div id="p2-label"><strong>P2:</strong> ⬅️/➡️ to Move | Enter to Fire</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // High Score Data Storage
    let hiScore = localStorage.getItem('arcade_hiscore') || 0;
    document.getElementById('hi-score-val').innerText = hiScore;

    // Game Engine State Vectors
    let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
    let isSoloMode = false;
    let isPvPMode = false;
    let items = [];
    let projectiles = [];
    let particles = [];
    let spawnTimer = 0;
    const keys = {};

    const BASE_SPEED = 5;
    const BOOST_SPEED = 9;

    // Player Configuration Setup
    const p1 = { x: 100, y: 370, width: 36, height: 36, color: '#00f0ff', score: 0, health: 100, speed: BASE_SPEED, shield: 0, magnet: 0, boost: 0, weapon: null, ammo: 0 };
    const p2 = { x: 460, y: 370, width: 36, height: 36, color: '#ff007f', score: 0, health: 100, speed: BASE_SPEED, shield: 0, magnet: 0, boost: 0, weapon: null, ammo: 0 };

    const itemTypes = {
        COIN: { label: '🪙', points: 10, damage: 0, color: '#ffea00', type: 'COIN' },
        BOMB: { label: '💣', points: 0, damage: 25, color: '#ff3333', type: 'BOMB' },
        LASER_DROP: { label: '🔫', points: 5, damage: 0, color: '#00ffff', type: 'WEAPON_LASER' },
        MISSILE_DROP: { label: '🚀', points: 5, damage: 0, color: '#ffea00', type: 'WEAPON_MISSILE' },
        SHIELD: { label: '🛡️', points: 5, damage: 0, color: '#00f0ff', type: 'SHIELD' }
    };

    window.addEventListener('keydown', e => { keys[e.code] = true; handleCombatInputs(e.code); });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // iPad Screen Tap Coordinates Vector Decoder
    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        if (gameState === "MENU") {
            if (clickY > 170 && clickY < 220) {
                if (clickX > 50 && clickX < 200) { isSoloMode = true; isPvPMode = false; startGame(); }
                if (clickX > 220 && clickX < 370) { isSoloMode = false; isPvPMode = false; startGame(); }
                if (clickX > 390 && clickX < 540) { isSoloMode = false; isPvPMode = true; startGame(); }
            }
        } else if (gameState === "GAMEOVER") {
            if (clickX > 220 && clickX < 380 && clickY > 250 && clickY < 300) resetToMenu();
        }
    });

    function resetToMenu() {
        gameState = "MENU";
        [p1, p2].forEach((p, idx) => {
            p.score = 0; p.health = 100; p.x = idx === 0 ? 100 : 460;
            p.shield = 0; p.weapon = null; p.ammo = 0; p.boost = 0; p.speed = BASE_SPEED;
        });
        items = []; projectiles = []; particles = [];
        updateHUD();
    }

    function startGame() {
        gameState = "PLAYING";
        document.getElementById('p2-hud').style.opacity = isSoloMode ? '0.2' : '1';
        document.getElementById('p2-label').style.opacity = isSoloMode ? '0.2' : '1';
    }

    function handleCombatInputs(code) {
        if (gameState === "MENU") {
            if (code === "Digit1") { isSoloMode = true; isPvPMode = false; startGame(); }
            if (code === "Digit2") { isSoloMode = false; isPvPMode = false; startGame(); }
            if (code === "Digit3") { isSoloMode = false; isPvPMode = true; startGame(); }
        } else if (gameState === "PLAYING" && isPvPMode) {
            if (code === "Space" && p1.health > 0 && p1.weapon) fireWeapon(p1, 1, p2);
            if ((code === "Numpad0" || code === "Enter") && p2.health > 0 && p2.weapon) fireWeapon(p2, -1, p1);
        } else if (gameState === "GAMEOVER" && (code === "Space" || code === "Enter")) {
            resetToMenu();
        }
    }

    function fireWeapon(player, direction, target) {
        if (player.ammo <= 0) return;
        player.ammo--;

        projectiles.push({
            x: direction === 1 ? player.x + player.width + 5 : player.x - 15,
            y: player.y + player.height / 2,
            vx: direction * (player.weapon === 'LASER' ? 9 : 5),
            width: player.weapon === 'LASER' ? 14 : 20,
            height: player.weapon === 'LASER' ? 4 : 8,
            damage: player.weapon === 'LASER' ? 15 : 35,
            color: player.color,
            type: player.weapon,
            owner: player
