<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Game</title>
    <style>
        :root { --blue: #00f0ff; --pink: #ff007f; --yellow: #ffea00; --green: #00ff66; }
        body { background: #040408; color: #fff; font-family: monospace; margin: 0; padding: 5px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; }
        .cab { display: flex; background: #111122; border: 4px solid var(--blue); border-radius: 12px; max-width: 900px; width: 100%; box-shadow: 0 0 20px rgba(0,240,255,0.3); }
        .side { width: 110px; background: #05050a; border-right: 4px dashed var(--pink); display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 10px 0; }
        .logo { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 1.8rem; font-weight: bold; text-shadow: 0 0 8px var(--pink); letter-spacing: 4px; }
        .main { flex-grow: 1; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .hud { display: flex; justify-content: space-between; width: 100%; max-width: 550px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #222; }
        .hp-bar { background: #222; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; width: 120px; border: 1px solid #444; }
        .hp { height: 100%; width: 100%; transition: width 0.1s; }
        #p1-hp { background: var(--blue); } #p2-hp { background: var(--pink); }
        .hi { color: var(--yellow); font-weight: bold; margin-bottom: 5px; }
        canvas { background: #020205; border: 2px solid #333; display: block; border-radius: 4px; touch-action: none; }
    </style>
</head>
<body>
<div class="cab">
    <div class="side"><div class="logo">B-COIN ARENA</div></div>
    <div class="main">
        <div class="hi">👑 HI-SCORE: <span id="hs">0</span></div>
        <div class="hud">
            <div><span style="color:var(--blue)">P1:</span> <span id="s1">0</span> <span id="i1"></span><div class="hp-bar"><div id="p1-hp" class="hp"></div></div></div>
            <div><span style="color:var(--pink)">P2:</span> <span id="s2">0</span> <span id="i2"></span><div class="hp-bar"><div id="p2-hp" class="hp"></div></div></div>
        </div>
        <canvas id="g" width="560" height="400"></canvas>
    </div>
</div>
<script>
    const c = document.getElementById('g'), ctx = c.getContext('2d');
    let hs = localStorage.getItem('arc_hs') || 0; document.getElementById('hs').innerText = hs;
    let state = "MENU", solo = true, pvp = false, items = [], projs = [], parts = [], timer = 0, keys = {};
    const p1 = { x: 80, y: 290, w: 32, h: 32, c: '#00f0ff', score: 0, health: 100, speed: 5, shield: 0, magnet: 0, weapon: null, ammo: 0 };
    const p2 = { x: 440, y: 290, w: 32, h: 32, c: '#ff007f', score: 0, health: 100, speed: 5, shield: 0, magnet: 0, weapon: null, ammo: 0 };
    const types = {
        C: { l: '🪙', p: 10, d: 0, c: '#ffea00', t: 'COIN' },
        B: { l: '💣', p: 0, d: 25, c: '#ff3333', t: 'BOMB' },
        S: { l: '🛡️', p: 5, d: 0, c: '#00f0ff', t: 'SHIELD' },
        M: { l: '🧲', p: 5, d: 0, c: '#ffaa00', t: 'MAGNET' },
        L: { l: '🔫', p: 5, d: 0, c: '#00ffff', t: 'W_L' },
        R: { l: '🚀', p: 5, d: 0, c: '#ffea00', t: 'W_R' }
    };
    const btns = {
        l1: { x: 15, y: 345, w: 45, h: 40, l: "⬅️P1" }, r1: { x: 65, y: 345, w: 45, h: 40, l: "➡️P1" }, f1: { x: 115, y: 345, w: 50, h: 40, l: "💥F1" },
        l2: { x: 380, y: 345, w: 45, h: 40, l: "⬅️P2" }, r2: { x: 430, y: 345, w: 45, h: 40, l: "➡️P2" }, f2: { x: 480, y: 345, w: 50, h: 40, l: "💥F2" }
    };
    window.addEventListener('keydown', e => { keys[e.code] = true; if(state==="MENU"){ if(e.code==="Digit1"){solo=true;pvp=false;start();} if(e.code==="Digit2"){solo=false;pvp=false;start();} if(e.code==="Digit3"){solo=false;pvp=true;start();} } else if(state==="PLAYING"&&pvp){ if(e.code==="Space"&&p1.health>0&&p1.weapon)fire(p1,1); if((e.code==="Enter"||e.code==="Numpad0")&&p2.health>0&&p2.weapon)fire(p2,-1); } else if(state==="GAMEOVER"&&(e.code==="Space"||e.code==="Enter"))menu(); });
    window.addEventListener('keyup', e => keys[e.code] = false);
    function handleT(e) {
        e.preventDefault(); const rect = c.getBoundingClientRect(); Object.values(btns).forEach(b => b.a = false);
        for(let i=0; i<e.touches.length; i++) {
            const t = e.touches[i], tx = t.clientX - rect.left, ty = t.clientY - rect.top;
            if(state === "MENU" && ty > 150 && ty < 200) {
                if(tx > 30 && tx < 170) { solo=true; pvp=false; start(); }
                if(tx > 200 && tx < 340) { solo=false; pvp=false; start(); }
                if(tx > 370 && tx < 510) { solo=false; pvp=true; start(); }
            } else if(state === "GAMEOVER" && tx > 200 && tx < 360 && ty > 220 && ty < 270) { menu(); }
            else if(state === "PLAYING") { Object.values(btns).forEach(b => { if(tx > b.x && tx < b.x + b.w && ty > b.y && ty < b.y + b.h) b.a = true; }); if(btns.f1.a && p1.health>0 && p1.weapon){ fire(p1,1); btns.f1.a=false; } if(!solo && btns.f2.a && p2.health>0 && p2.weapon){ fire(p2,-1); btns.f2.a=false; } }
        }
    }
    c.addEventListener('touchstart', handleT); c.addEventListener('touchmove', handleT); c.addEventListener('touchend', handleT);
    function menu() { state = "MENU"; [p1,p2].forEach((p,i)=>{ p.score=0; p.health=100; p.x=i===0?80:440; p.shield=0; p.magnet=0; p.weapon=null; p.ammo=0; }); items=[]; projs=[]; parts=[]; hud(); }
    function start() { state = "PLAYING"; }
    function fire(p, dir) { if(p.ammo<=0)return; p.ammo--; projs.push({ x: dir===1?p.x+p.w+4:p.x-12, y: p.y+p.h/2, vx: dir*(p.weapon==='LASER'?8:5), w: p.weapon==='LASER'?12:18, h: p.weapon==='LASER'?4:6, dmg: p.weapon==='LASER'?15:35, c: p.c, o: p }); if(p.ammo<=0)p.weapon=null; hud(); }
    function exp(x, y, color) { for(let i=0; i<8; i++) parts.push({ x: x, y: y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, r: Math.random()*2+1, c: color, a: 1 }); }
    function update() {
        if(state !== "PLAYING") return;
        if((keys['KeyA']||btns.l1.a) && p1.x > 5) p1.x -= p1.speed; if((keys['KeyD']||btns.r1.a) && p1.x < c.width - p1.w - 5) p1.x += p1.speed;
        if(!solo && p2.health > 0) { if((keys['ArrowLeft']||btns.l2.a) && p2.x > 5) p2.x -= p2.speed; if((keys['ArrowRight']||btns.r2.a) && p2.x < c.width - p2.w - 5) p2.x += p2.speed; }
        for(let i=projs.length-1; i>=0; i--) {
            let p = projs[i]; p.x += p.vx; if(p.x<0 || p.x>c.width) { projs.splice(i,1); continue; }
            let ts = pvp ? [p1,p2] : []; ts.forEach(t => { if(t!==p.o && t.health>0 && p.x>t.x && p.x<t.x+t.w && p.y>t.y && p.y<t.y+t.h) { exp(p.x,p.y,'#fff'); if(t.shield>0) t.shield--; else t.health=Math.max(0,t.health-p.dmg); projs.splice(i,1); hud(); } });
        }
        timer++; if(timer % 50 === 0) { let pool = Object.values(types); if(!pvp) pool = pool.filter(t=>!t.t.startsWith('W')); items.push({ x: Math.random()*(c.width-40)+20, y: -10, s: Math.random()*2+2, type: pool[Math.floor(Math.random()*pool.length)] }); }
        for(let i=items.length-1; i>=0; i--) {
            let item = items[i]; item.y += item.s;
            [p1,p2].forEach((p,idx) => { if(idx===1&&solo)return; if(p.magnet>0&&p.health>0&&item.type.t!=='BOMB') { let dx=(p.x+p.w/2)-item.x, dy=(p.y+p.h/2)-item.y, d=Math.sqrt(dx*dx+dy*dy); if(d<120) { item.x+=dx/d*2; item.y+=dy/d*0.5; } } });
            [p1,p2].forEach((p,idx) => { if(idx===1&&solo)return; if(p.health>0&&item.x>p.x&&item.x<p.x+p.w&&item.y>p.y&&item.y<p.y+p.h) { hit(p,item.type,idx===0?'1':'2'); items.splice(i,1); } });
            if(item&&item.y>c.height) items.splice(i,1);
        }
        for(let i=parts.length-1; i>=0; i--) { let p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.a-=0.03; if(p.a<=0) parts.splice(i,1); }
        let cm = pvp ? 0 : (solo ? p1.score : Math.max(p1.score,p2.score)); if(cm > hs) { hs = cm; localStorage.setItem('arc_hs', hs); document.getElementById('hs').innerText = hs; }
        if(p1.health<=0 && (solo || p2.health<=0 || pvp)) state = "GAMEOVER";
    }
    function hit(p, t, pref) {
        exp(p.x+p.w/2, p.y+p.h/2, t.c);
        if(t.t==='BOMB') { if(p.shield>0)p.shield--; else p.health=Math.max(0,p.health-t.d); }
        else if(t.t==='COIN') p.score+=t.p;
        else if(t.t==='SHIELD') p.shield++;
        else if(t.t==='MAGNET') p.magnet=250;
        else if(t.t==='W_L') { p.weapon='LASER'; p.ammo=6; }
        else if(t.t==='W_R') { p.weapon='MISSILE'; p.ammo=3; }
        hud();
    }
    function hud() {
        document.getElementById('s1').innerText=p1.score; document.getElementById('s2').innerText=p2.score;
        document.getElementById('p1-hp').style.width=p1.health+'%'; document.getElementById('p2-hp').style.width=p2.health+'%';
        [p1,p2].forEach((p,i)=>{ let s=''; if(p.shield>0)s+='🛡️'; if(p.magnet>0)s+='🧲'; if(p.weapon)s+=(p.weapon==='LASER'?'🔫':'🚀')+'x'+p.ammo; document.getElementById('i'+(i+1)).innerText=s; });
    }
    function draw() {
        ctx.clearRect(0,0,c.width,c.height);
        if(state === "MENU") {
            ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.font="bold 16px monospace"; ctx.fillText("SELECT SYSTEM MODE", c.width/2, 80);
            const ms = [{x:30,l:"1: SOLO",col:"var(--blue)"},{x:200,l:"2: CO-OP",col:"var(--pink)"},{x:370,l:"3: PVP COMBAT",col:"var(--yellow)"}];
            ms.forEach(m=>{ ctx.strokeStyle=m.col; ctx.strokeRect(m.x,140,140,45); ctx.fillStyle="#fff"; ctx.fillText(m.l,m.x+70,168); });
        } else {
            if(p1.health>0) { ctx.fillStyle=p1.c; ctx.fillRect(p1.x,p1.y,p1.w,p1.h); if(p1.shield>0){ctx.strokeStyle='#fff';ctx.strokeRect(p1.x-2,p1.y-2,p1.w+4,p1.h+4);} }
